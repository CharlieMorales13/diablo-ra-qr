<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Compilar target MindAR</title>
  <style>body{font:16px system-ui;margin:2rem;max-width:40rem}</style>
</head>
<body>
  <h1>Compilar marcador → targets.mind</h1>
  <p>Elige el PNG del marcador (por defecto <code>marcador.png</code>). Al terminar se descarga <code>targets.mind</code>; cópialo a <code>assets/targets.mind</code>.</p>
  <input type="file" id="file" accept="image/*">
  <button id="def">Usar marcador.png</button>
  <p id="out"></p>
  <script type="module">
    import { Compiler } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';

    const out = document.getElementById('out');

    async function compileFromUrl(url) {
      const img = new Image();
      img.src = url;
      await img.decode();
      const compiler = new Compiler();
      await compiler.compileImageTargets([img], p => out.textContent = 'Compilando… ' + p.toFixed(0) + '%');
      return new Uint8Array(await compiler.exportData());
    }

    function download(bytes) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([bytes]));
      a.download = 'targets.mind';
      a.click();
      out.textContent = 'Listo: targets.mind (' + bytes.length + ' bytes)';
    }

    // expuesto para compilar sin interfaz (Playwright)
    window.compileFromUrl = compileFromUrl;

    document.getElementById('def').onclick = async () => download(await compileFromUrl('marcador.png'));
    document.getElementById('file').onchange = async e => download(await compileFromUrl(URL.createObjectURL(e.target.files[0])));
  </script>
</body>
</html>
